services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    # Only reachable through Caddy. Uncomment to expose directly (e.g. for a tunnel).
    # ports:
    #   - "3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
